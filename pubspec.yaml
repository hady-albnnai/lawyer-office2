name: lawyer_office
description: تطبيق إدارة وأرشفة مكتب محاماة سوري متكامل (Offline-First V6.2)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database & Offline Storage (Drift + SQLite)
  drift: ^2.34.3
  # sqlite3_flutter_libs توقفت رسمياً (0.6.0+eol)؛
  # sqlite3 3.x صار يوفّر مكتبات المنصة بنفسه ولا حاجة للحزمة القديمة.
  sqlite3: ^3.5.0
  path_provider: ^2.1.2
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Navigation & Routing
  go_router: ^14.1.0

  # Files, Attachments & Word/PDF Processing
  archive: ^4.0.9
  encrypt: ^5.0.3
  window_manager: ^0.5.2
  tray_manager: ^0.2.4
  local_notifier: ^0.1.6
  file_picker: ^11.0.2
  open_filex: ^4.5.0
  # Updated for compatibility with printing 5.15.0
  pdf: ^3.13.0
  image: ^4.9.1
  # لا تحذف printing: مستخدمة في Printing.layoutPdf / sharePdf / PdfPreview
  # ضمن finance_screen, legal_printing_screen, search_reports_screen,
  # daily_work_center_screen, work_order_dialogs.
  # ملاحظة: تنزّل pdfium أثناء أول بناء على ويندوز (قد يستغرق وقتاً).
  printing: ^5.15.0

  # Formatting, Security & Localization
  intl: ^0.20.2
  crypto: ^3.0.5
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # مستخدمة مباشرة في الاختبارات (mocking للمنصات)
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  build_runner: ^2.4.9
  drift_dev: ^2.34.3

# Dependency overrides to ensure compatibility
dependency_overrides:
  archive: ^4.0.9
  image: ^4.9.1
  pdf: ^3.13.0
  printing: ^5.15.0
  xml: ^7.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
